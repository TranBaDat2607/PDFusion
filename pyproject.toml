[project]
name = "pdfusion"
version = "1.0.6"
description = "Professional PDF Translation Application with AI-powered Q&A and Vietnamese optimization"
authors = [
    {name = "PDFusion Team", email = "contact@pdfusion.dev"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["pdf", "translation", "vietnamese", "ai", "rag", "desktop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core dependencies - essential for basic functionality
dependencies = [
    # Core system
    "numpy>=2.0.2,<3.0.0",

    # Configuration and validation
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "tomlkit>=0.12.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "cryptography>=41.0.0,<43.0.0",

    # PDF processing
    "PyMuPDF>=1.25.1,<1.26.0",
    "Pillow>=9.5.0,<11.0.0",
    "babeldoc>=0.5.20,<0.6.0",

    # Offline / free translation backend (default when no LLM key is configured)
    "argostranslate>=1.9.0,<2.0.0",

    # API sidecar (Tauri shell consumes this over loopback HTTP)
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "sse-starlette>=2.1.0,<3.0.0",

    # Translation services
    "openai>=1.3.0,<2.0.0",
    "google-genai>=1.0.0,<2.0.0",
    "anthropic>=0.40.0,<1.0.0",
    "tiktoken>=0.5.0,<1.0.0",

    # Logging
    "colorama>=0.4.6; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    # The linter CI actually runs; black/isort/flake8/mypy stay available for
    # local use but are not gates.
    "ruff>=0.14.0",
    # Bundle the sidecar into a standalone .exe for the desktop installer.
    "pyinstaller>=6.10",
]

# RAG and advanced features
rag = [
    # Vector database and embeddings
    "chromadb>=0.4.15,<0.5.0",
    "sentence-transformers>=2.3.0,<3.0.0",
    "faiss-cpu>=1.7.4,<2.0.0",

    # LangChain framework (reserved for future hybrid retrieval)
    "langchain>=0.3.0,<0.4.0",
    "langchain-community>=0.3.0,<0.4.0",
    "rank-bm25>=0.2.2,<1.0.0",
]

# Advanced PDF processing
advanced = [
    "camelot-py>=0.11.0,<1.0.0",
    "pdfplumber>=0.10.0,<1.0.0",
]

# All optional features
all = [
    "pdfusion[rag,advanced]"
]

[project.scripts]
pdfusion-sidecar = "desktop_pdf_translator.api.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Hatchling can't auto-detect the wheel contents because the project name
# (`pdfusion`) doesn't match the Python package name (`desktop_pdf_translator`),
# and the package lives under `src/`. Point hatch at it explicitly.
[tool.hatch.build.targets.wheel]
packages = ["src/desktop_pdf_translator"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["dist", "build", "desktop/src-tauri"]

# Ruff's default rule set: pycodestyle errors (E4/E7/E9) and pyflakes (F).
# Deliberately not widened. The point of the gate is to catch the class of
# thing that breaks a build — an undefined name, a syntax error, a dead import
# that hides a real one — and a gate nobody can keep green stops being a gate.
# Line length in particular is left to `black`, which is not wired into CI:
# reflowing the existing prose comments would bury every real diff.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests/conftest.py` also prepends src/ to sys.path, so the suite runs from a
# bare checkout with no editable install.
pythonpath = ["src"]
# `-m "not smoke"` keeps the default run in-process, which is what makes the
# whole suite finish in about a second. The smoke tests spawn real sidecar
# processes and cost tens of seconds; run them with `-m smoke` (CI does, in a
# job of its own).
addopts = "-q -m 'not smoke'"
markers = [
    "smoke: spawns a real sidecar process; excluded from the default run",
]
