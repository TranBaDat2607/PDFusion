[package]
name = "desktop"
version = "1.1.0"
description = "PDFusion desktop"
authors = ["PDFusion"]
edition = "2021"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Desktop-app basics. `single-instance` must be registered before any other
# plugin (see lib.rs) so a second launch is short-circuited before the rest of
# the app — and a second sidecar — comes up.
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-log = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Sidecar lifecycle
tokio = { version = "1", features = ["process", "io-util", "macros", "rt-multi-thread", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
once_cell = "1"
log = "0.4"
which = "6"

# Job Objects + CREATE_NO_WINDOW, both behind `#[cfg(windows)]` in sidecar.rs.
# Target-gated so a Linux or macOS build never resolves, downloads or compiles
# it: it no-ops off Windows, but "no-ops" is not the same as "absent", and the
# only reason it was ever unconditional is that there was only ever one target
# (#69).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
